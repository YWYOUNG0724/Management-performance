<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>자율성과지표 성과관리 | 계명문화대학교 혁신지원사업단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--surface:#FFFFFF;--ink:#0F1E33;--muted:#4A5568;--line:#DDE3EA;--line2:#E7ECF2;--track:#E4E9F0;--thead:#F4F6F9;--head:#1F3A5F;--head-on:#14283F;--badge:#1F3A5F;--pill-bg:#E8EEF6;--pill-ink:#1F3A5F;--link:#1F3A5F;--na:#8A97A8;--na-bg:#EEF1F5;--sel:#F1F5FA;--ok:#1F5FA8;--warn:#C2620A;--warn-bg:#FBEEDF;
--t-red:#D23B3B;--t-red-bg:#FCE7E7;--t-red-ink:#A32626;--t-yel:#E0A800;--t-yel-bg:#FDF3D3;--t-yel-ink:#7A5A00;--t-blue:#2F6FD1;--t-blue-bg:#E3EDF8;--t-blue-ink:#1F5FA8;color-scheme:light}
:root.dark{--bg:#0E1621;--surface:#16212F;--ink:#E6ECF3;--muted:#A9B6C6;--line:#27354B;--line2:#223047;--track:#2A3A51;--thead:#1B283A;--head:#14263D;--head-on:#0B1726;--badge:#2E5A8F;--pill-bg:#22385A;--pill-ink:#C3D6EF;--link:#9DBEE6;--na:#6E7D92;--na-bg:#222E3E;--sel:#1C2A3C;--ok:#5B9BE0;--warn:#E8954A;--warn-bg:#3A2A1A;
--t-red:#F06A6A;--t-red-bg:#3D1F22;--t-red-ink:#F5A3A3;--t-yel:#F2C230;--t-yel-bg:#3A3018;--t-yel-ink:#F2D27A;--t-blue:#6AA5F0;--t-blue-bg:#1C3350;--t-blue-ink:#A9CBF5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.6;transition:background-color .2s,color .2s}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
/* header */
.top{background:var(--head);color:#fff}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:8px;background:#fff;color:var(--head);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.brand small{display:block;font-size:12px;color:#B8C4D6;letter-spacing:.04em}
.brand strong{font-size:18px}
.topnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.topnav a{color:#D5DDE8;text-decoration:none;padding:10px 14px;border-radius:6px;font-size:14px}
.topnav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topnav a.on{background:var(--head-on);color:#fff;font-weight:600}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:22px;background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
#app{display:flex;flex-direction:column;gap:32px;padding:28px 0 64px}
/* status bar */
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.status.off{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hero h1{margin:4px 0 0;font-size:28px;letter-spacing:-.01em}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.seg{display:flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--head);color:#fff}
.clock{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.clock div{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--head);border-color:var(--head);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
/* donut cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--muted)}
.card.avg{background:var(--head);border-color:var(--head);color:#fff}
.card.avg .trk{stroke:rgba(255,255,255,.16)}
.card.avg .sub{color:#C9D4E3}
.card h3{margin:0;font-size:14px;font-weight:600}
.ring{position:relative}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.ring .big span{font-size:15px;font-weight:500;opacity:.75}
.ring .sub{font-size:12px;color:var(--muted)}
.trk{stroke:var(--track)}
.val{stroke:var(--c)}
.tone-blue{--c:var(--t-blue);--cb:var(--t-blue-bg);--ci:var(--t-blue-ink)}
.tone-yel{--c:var(--t-yel);--cb:var(--t-yel-bg);--ci:var(--t-yel-ink)}
.tone-red{--c:var(--t-red);--cb:var(--t-red-bg);--ci:var(--t-red-ink)}
.tone-na{--c:var(--na);--cb:var(--na-bg);--ci:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--cb);color:var(--ci)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px;background:var(--c)}
/* sections */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.panel-head h2,.sec-title h2{margin:0;font-size:19px}
.sec-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.sec-title h2{font-size:22px}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--badge);border-radius:4px;padding:2px 8px}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:4px;background:var(--pill-bg);color:var(--pill-ink)}
.ix-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ix-title h3{margin:0;font-size:19px}
.subgrid{padding:22px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;border-bottom:1px solid var(--line2)}
.subcard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line2);border-radius:10px}
.subcard .ring .center{font-size:15px;font-weight:700}
.subcard b{display:block;font-size:14px;line-height:1.4}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--thead);color:var(--muted);font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap}
td{padding:13px 12px;border-top:1px solid var(--line2);vertical-align:top}
th:first-child,td:first-child{padding-left:24px}
th:last-child,td:last-child{padding-right:24px}
.r{text-align:right}
.selcol{background:var(--sel);color:var(--ink)}
tr.total td{border-top:2px solid var(--line);background:var(--thead);font-weight:700}
.bar{position:relative;flex:1;height:8px;border-radius:4px;background:var(--track)}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}
.list svg{flex:none;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}
.pad{padding:20px 24px}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-top:24px;padding-bottom:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
/* dialog */
dialog{width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,35,.55)}
.dlg-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.dlg-head h2{margin:0;font-size:19px}
.dlg-body{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.dlg-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
label.f textarea{min-height:44px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--t-blue);outline-offset:2px}
.edit-ix{border:1px solid var(--line);border-radius:10px}
.edit-ix>h3{margin:0;padding:12px 16px;font-size:15px;background:var(--thead);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.edit-row{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(130px,.6fr) minmax(200px,1.6fr) auto;gap:12px;align-items:end;padding:14px 16px;border-top:1px solid var(--line2)}
.edit-row:first-of-type{border-top:0}
.edit-row .name{font-weight:600;font-size:14px}
.edit-row .name small{display:block;font-weight:400;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;color:var(--muted);white-space:nowrap}
.check input{width:18px;height:18px}
.helper{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:10px 12px;border-radius:8px;background:var(--sel);font-size:13px}
.helper label.f{min-width:150px}
.err{color:var(--t-red-ink);font-size:14px;font-weight:600}
.btn-ai{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:#fff;color:var(--head);font-size:13px;font-weight:700;cursor:pointer}
.btn-ai:hover{background:#E8EEF6}
.btn-ai svg{width:18px;height:18px}
.ai-src{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:10px;background:var(--sel);font-size:13px}
.ai-doc h3{font-size:16px;margin:18px 0 6px;color:var(--ink);padding-bottom:4px;border-bottom:2px solid var(--line)}
.ai-doc h3:first-child{margin-top:0}
.ai-doc ul{margin:4px 0 6px;padding-left:20px}
.ai-doc li{margin:4px 0}
.ai-doc p{margin:6px 0}
.ai-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 8px}
.ai-kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.ai-kpi b{display:block;font-size:13px}
.ai-kpi span{font-size:18px;font-weight:700}
.ai-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px 16px;border:1px dashed var(--line);border-radius:10px}
.spin{width:18px;height:18px;border:3px solid var(--track);border-top-color:var(--t-blue);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--head);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:all .25s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:720px){.edit-row{grid-template-columns:1fr 1fr}.edit-row .name{grid-column:1/-1}}
@media print{.top .topnav,.controls .btn,.seg,.status,#verify,#history,.clock,.btn-ghost{display:none!important}body{background:#fff}.panel,.card{break-inside:avoid}.card.avg{background:#fff;color:#000;border-color:#999}}
</style>
</head>

<div class="wrap">

<footer><div class="wrap"><span>© <span id="yr"></span> 계명문화대학교 전문대학혁신지원사업단</span><span>출처: 자율성과지표 정의서·1차년도 달성도, 2026학년도 자율성과지표 현황. ’26 값은 중간 집계로 확정 실적이 아님.</span></div></footer>

<div class="dlg-body" id="editBody"></div>

    '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="' + HEX[tier(rate)] + '" stroke-width="' + st + '" stroke-dasharray="' + len.toFixed(2) + ' ' + c.toFixed(2) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/>' +
    '<text x="' + h + '" y="' + (h + size * 0.07) + '" text-anchor="middle" font-size="' + Math.round(size * 0.2) + '" font-weight="700" fill="#0F1E33">' + (rate == null ? '—' : f1(rate)) + '</text></svg>';

function saveLocal() { store('perf-data', JSON.stringify(DATA)); store('perf-history', JSON.stringify(HISTORY.slice(0, 200))); }
function applyLocal(actuals, editor, asOf) {
  var next = JSON.parse(JSON.stringify(DATA)), changes = [];
  var subs = {}; next.indices.forEach(function (ix) { ix.subs.forEach(function (s) { subs[s.id] = s; }); });
  Object.keys(actuals).forEach(function (sid) {

    var v = it.c26 == null ? null : Number(it.c26);

  });
  if (asOf && asOf !== next.meta.asOf) { changes.push('집계 기준일 ' + next.meta.asOf + ' → ' + asOf); next.meta.asOf = asOf; }
  if (!changes.length) return { unchanged: true };
  var now = new Date().toISOString();
  next.version = (next.version || 0) + 1; next.meta.updatedAt = now; next.meta.updatedBy = editor;
  DATA = next; HISTORY.unshift({ at: now, editor: editor, version: next.version, changes: changes });
  try { saveLocal(); if (store('perf-data') == null) throw new Error(); } catch (e) { return { error: '이 브라우저에 저장할 수 없습니다(저장공간 차단). [데이터 백업]으로 파일을 받아 두세요.' }; }
  return { ok: true };
}

  miss.forEach(function (o) { L.push('- 집계 전: ' + o.x.s.name + ' — ' + (o.x.s.n26 || '집계 일정 확인 필요')); });
  flag.forEach(function (o) { L.push('- 확인 필요: ' + o.x.s.name + ' — ' + (o.x.s.n26 || '출처 확인')); });
  if ((DATA.pending || []).length) L.push('- 원문(HWPX·엑셀) 정정 필요 사항 ' + DATA.pending.length + '건 미해결');
  L.push('## 권고 조치');
  low.forEach(function (o) { L.push('- ' + o.x.s.dept + ': ' + o.x.s.name + ' 하반기 추진 일정 점검 및 실적 조기 집계'); });
  miss.forEach(function (o) { L.push('- ' + o.x.s.dept + ': ' + o.x.s.name + ' 집계 시점 확정 후 즉시 입력'); });
  flag.forEach(function (o) { L.push('- ' + o.x.s.dept + ': ' + o.x.s.name + ' 수치 출처 확인 후 정정'); });
  L.push('- 사업단: 원문 정정 필요 사항 일괄 정리 및 자체성과관리위원회 보고');
  return L.join('\n');
}
function mdToHtml(md) {
  var out = [], inList = false;
  esc(md).split(/\r?\n/).forEach(function (line) {
    var t = line.trim(); if (!t) return;
    t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^#{1,4}\s/.test(t)) { if (inList) { out.push('</ul>'); inList = false; } out.push('<h3>' + t.replace(/^#{1,4}\s*/, '') + '</h3>'); }
    else if (/^[-*•·]\s/.test(t)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + t.replace(/^[-*•·]\s*/, '') + '</li>'); }
    else { if (inList) { out.push('</ul>'); inList = false; } out.push('<p>' + t + '</p>'); }
  });
  if (inList) out.push('</ul>');
  return out.join('');
}
function aiKpis() {
  var idx = build('26'), avg = idx.reduce(function (a, b) { return a + b.rate; }, 0) / idx.length;
  var h = '<div class="ai-kpis"><div class="ai-kpi tone-' + tier(avg) + '"><div class="ring" style="width:44px;height:44px">' + donut(avg, 44, 7) + '</div><div><b>평균 진행률</b><span class="num">' + f1(avg) + '%</span></div></div>';
  idx.forEach(function (d) { h += '<div class="ai-kpi tone-' + d.tone + '"><div class="ring" style="width:44px;height:44px">' + donut(d.rate, 44, 7) + '</div><div><b>' + esc(d.ix.name) + '</b><span class="num">' + f1(d.rate) + '%</span></div></div>'; });
  return h + '</div>';
}
function aiLocalKey() { return store('perf-ai-key') || ''; }
function aiAvailable() { return (ONLINE && AI.serverEnabled) || (!ONLINE && !!aiLocalKey()); }
function renderAi(text, source) {
  AI.text = text; AI.mode = source;
  document.getElementById('aiDoc').innerHTML = aiKpis() + mdToHtml(text);
  var src = document.getElementById('aiSrc'), btn;
  var label = source === 'claude' ? '<span><b>Claude AI 요약</b> · ' + esc(AI.model || '') + ' · 생성 ' + esc(fmtStamp(new Date().toISOString())) + '</span>'
    : '<span><b>자동 분석 요약</b> · 대시보드 수치를 규칙에 따라 즉시 정리 (인터넷 불필요)</span>';
  if (aiAvailable()) btn = '<button type="button" class="btn primary" style="min-height:40px" data-action="ai-gen">' + (source === 'claude' ? '다시 생성' : 'Claude AI로 요약 생성') + '</button>';
  else btn = '<button type="button" class="btn" style="min-height:40px" data-action="ai-settings">Claude AI 연결 설정</button>';
  src.innerHTML = label + btn;
}
function openAi() {
  document.getElementById('aiSub').textContent = '집계 기준일 ' + (DATA.meta.asOf || '—') + ' · 데이터 v' + DATA.version;
  document.getElementById('aiSet').innerHTML = '';
  var p = ONLINE ? fetch('/api/ai-status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { AI.serverEnabled = !!j.enabled; AI.model = j.model || ''; }).catch(function () {}) : Promise.resolve();
  if (!ONLINE) AI.model = store('perf-ai-model') || 'claude-sonnet-5-5';
  renderAi(autoSummary(), 'auto');
  aiDlg.showModal();
  p.then(function () { if (AI.mode === 'auto') renderAi(AI.text, 'auto'); });
}
function aiSettings() {
  var box = document.getElementById('aiSet');
  if (ONLINE) {
    box.innerHTML = '<div class="ai-set"><div style="grid-column:1/-1;font-size:14px"><b>Claude AI 연결 방법 (관리자)</b><br>Netlify 사이트 설정 &gt; Environment variables 에 <code>ANTHROPIC_API_KEY</code>(발급 키)를 추가하고 다시 배포하면 접속자 모두 Claude AI 요약을 쓸 수 있습니다. 키는 Netlify에만 보관되며 브라우저로 전달되지 않습니다. 모델 변경은 <code>AI_MODEL</code> 변수로 지정합니다.</div></div>';
    return;
  }
  box.innerHTML = '<div class="ai-set"><label class="f">Claude API 키<input id="aiKey" type="password" autocomplete="off" placeholder="sk-ant-..." value="' + esc(aiLocalKey()) + '"></label>' +
    '<label class="f">모델<input id="aiModel" value="' + esc(store('perf-ai-model') || 'claude-sonnet-5-5') + '"></label>' +
    '<div style="display:flex;gap:8px;align-items:flex-end"><button type="button" class="btn primary" style="min-height:44px" data-action="ai-save-key">저장</button><button type="button" class="btn" style="min-height:44px" data-action="ai-del-key">키 삭제</button></div>' +
    '<div class="muted" style="grid-column:1/-1;font-size:12px">키는 이 PC 브라우저에만 저장됩니다. 공용 PC에서는 사용 후 [키 삭제]를 눌러 주세요. 인터넷 연결이 필요하며, 요약 시 지표 수치(개인정보 없음)가 Anthropic API로 전송됩니다.</div></div>';
}
function aiGenerate() {
  var doc = document.getElementById('aiDoc'), src = document.getElementById('aiSrc');
  src.innerHTML = '<span><span class="spin"></span> Claude AI가 요약을 작성하는 중입니다…</span>';
  var facts = aiFacts(), req;
  if (ONLINE) {
    req = fetch('/api/ai-summary', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ facts: facts }) })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.error || ('AI 요청 실패 (' + r.status + ')')); });
        AI.model = r.headers.get('x-ai-model') || AI.model;
        if (!r.body || !r.body.getReader) return r.text();
        var rd = r.body.getReader(), dec = new TextDecoder(), acc = '';
        function pump() {
          return rd.read().then(function (x) {
            if (x.done) return acc + dec.decode();
            acc += dec.decode(x.value, { stream: true });
            doc.innerHTML = aiKpis() + mdToHtml(acc);
            return pump();
          });
        }
        return pump();
      });
  } else {
    AI.model = store('perf-ai-model') || 'claude-sonnet-5-5';
    req = fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': aiLocalKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: AI.model, max_tokens: 2000, system: AI_SYSTEM, messages: [{ role: 'user', content: '다음 성과지표 데이터를 요약 보고서로 작성해 주세요.\n' + JSON.stringify(facts) }] }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status)); return (j.content || []).filter(function (c) { return c.type === 'text'; }).map(function (c) { return c.text; }).join('\n'); }); });
  }
  req.then(function (text) { if (!text) throw new Error('빈 응답'); renderAi(text, 'claude'); })
    .catch(function (e) { renderAi(AI.text || autoSummary(), 'auto'); var msg = /fetch|network/i.test(e.message) ? '인터넷 연결 또는 API 키를 확인해 주세요' : e.message; toast('AI 요약 실패: ' + msg + ' · 자동 분석 요약을 표시합니다'); });
}
function aiPrint() {
  var w = window.open('', '_blank'); if (!w) { toast('팝업이 차단되었습니다.'); return; }
  var body = mdToHtml(AI.text);
  w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AI 요약 보고서</title><style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:760px;margin:24px auto;padding:0 24px;line-height:1.6;color:#111}h1{font-size:18pt;color:#1F3A5F;margin:0}h3{font-size:12.5pt;color:#1F3A5F;border-bottom:2px solid #1F3A5F;padding-bottom:3px;margin:18px 0 6px}li{margin:3px 0}.m{color:#555;font-size:10pt;margin:4px 0 14px}@media print{body{margin:0}}</style></head><body>' +
    '<h1>자율성과지표 AI 요약 보고서</h1><div class="m">' + esc(DATA.meta.university + ' ' + DATA.meta.unit) + ' · 집계 기준일 ' + esc(DATA.meta.asOf || '') + ' · ' + (AI.mode === 'claude' ? 'Claude AI 요약' : '자동 분석 요약') + '</div>' + body +
    '<p class="m" style="margin-top:20px">※ 입력 데이터 기반 요약이며, ’26 수치는 중간 집계로 확정 실적이 아님.</p></body></html>');
  w.document.close(); setTimeout(function () { w.print(); }, 300);
}

/* ---------- CSV ---------- */
function exportCsv() {
  var rows = [['지표', '세부지수', '단위', '가중치(%)', '기준값', '25목표', '25실적', '25달성률(%)', '26목표', '26현재', '26진행률(%)', '27목표', '담당부서', '26집계현황']];
  build('26').forEach(function (d) {
    d.subs.forEach(function (x) {
      var s = x.s, r25 = s.a25 == null ? '' : f1(s.a25 / s.t25 * 100);
      rows.push([d.ix.name, s.name, s.unit, s.w, s.base, s.t25, s.a25 == null ? '' : s.a25, r25, s.t26, s.c26 == null ? '' : s.c26, x.rate == null ? '' : f1(x.rate), s.t27, s.dept, s.n26 || '']);
    });
    rows.push([d.ix.name, '종합지수', '%', 100, d.ix.base, d.ix.t25, d.ix.a25, f1(d.ix.r25), d.ix.t26, f1(d.c26), f1(d.r26), d.ix.t27, '', d.partial ? '부분 집계' : '']);
  });
  var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '자율성과지표_' + (DATA.meta.asOf || 'export') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]'); if (!t) return;
  var a = t.getAttribute('data-action');
  if (a === 'year') { YEAR = t.getAttribute('data-y'); render(); }
  else if (a === 'open-edit') { if (!t.disabled) openEdit(t.getAttribute('data-ix')); }
  else if (a === 'report') openReport();
  else if (a === 'backup') backupJson();
  else if (a === 'ai-open') { if (DATA) openAi(); }
  else if (a === 'ai-close') aiDlg.close();
  else if (a === 'ai-gen') aiGenerate();
  else if (a === 'ai-settings') aiSettings();
  else if (a === 'ai-save-key') { var k = document.getElementById('aiKey').value.trim(), md = document.getElementById('aiModel').value.trim(); store('perf-ai-key', k); store('perf-ai-model', md || 'claude-sonnet-5-5'); document.getElementById('aiSet').innerHTML = ''; renderAi(AI.text, AI.mode); toast(k ? 'API 키를 저장했습니다' : '키가 비어 있습니다'); }
  else if (a === 'ai-del-key') { try { localStorage.removeItem('perf-ai-key'); } catch (e2) {} document.getElementById('aiSet').innerHTML = ''; renderAi(AI.text, AI.mode); toast('API 키를 삭제했습니다'); }
  else if (a === 'ai-copy') { var txt = AI.text.replace(/\*\*/g, '').replace(/^##\s*/gm, '■ '); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('요약 내용을 복사했습니다'); }, function () { toast('복사할 수 없습니다. 내용을 직접 선택해 복사해 주세요.'); }); }
  else if (a === 'ai-print') aiPrint();
  else if (a === 'restore') restoreJson();
  else if (a === 'close-edit') dlg.close();
  else if (a === 'csv') exportCsv();
  else if (a === 'print') window.print();
});

/* ---------- 데이터 로딩·동기화 ---------- */
function loadHistory() {
  return fetch('/api/history', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (h) { HISTORY = h; }).catch(function () {});
}
function sync(first) {
  return fetch('/api/data', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) {
      var changed = !DATA || d.version !== DATA.version, was = ONLINE;
      ONLINE = true; LAST_SYNC = new Date();
      if (changed || !was) {
        DATA = d;
        return loadHistory().then(function () {
          if (dlg.open) return;
          render();
          if (!first && changed) toast('다른 사용자가 수정한 내용이 반영되었습니다 (v' + d.version + ')');
        });
      }
    })
    .catch(function () {
      var was = ONLINE; ONLINE = false;
      if (!DATA) {
        LOCAL = location.protocol === 'file:';
        var savedData = null; try { savedData = JSON.parse(store('perf-data') || 'null'); HISTORY = JSON.parse(store('perf-history') || '[]'); } catch (e) { HISTORY = []; }
        DATA = LOCAL && savedData && savedData.indices ? savedData : JSON.parse(document.getElementById('seed').textContent);
        render();
      }
      else if (was && !dlg.open) { render(); toast('서버 연결이 끊겼습니다'); }
    });
}
sync(true);
setInterval(function () { if (!document.hidden && !LOCAL) sync(false); }, POLL_MS);
document.addEventListener('visibilitychange', function () { if (!document.hidden && !LOCAL) sync(false); });
})();
