<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16233b">
<title>계명문화대 규정집 AI 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout idea: 규정집(법전) 콘솔 — 좌측 조문 목차형 내비게이션 + 우측 작업면. 모바일은 상단 요약 + 하단 탭바. */
:root{
  --ink:#16233b;          /* 법전 표지 남색: 헤더·내비 */
  --paper:#f4f5f7;        /* 작업면 배경 */
  --surface:#ffffff;      /* 카드 */
  --line:#dbe0e8;         /* 구분선 */
  --text:#1c2333;         /* 본문 */
  --muted:#5d6678;        /* 보조 */
  --accent:#9a6b14;       /* 인장 금색: 핵심 동작 강조 */
  --accent-soft:#f6eedc;
  --nav-text:#c9d2e3;
  --crit:#b3362a; --crit-soft:#fbe9e6;
  --warn:#a3640c; --warn-soft:#fbf1df;
  --ok:#2a7354;  --ok-soft:#e3f2ea;
  --info:#2c5aa0; --info-soft:#e6eefa;
  --font-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0d1526; --paper:#121722; --surface:#1a2130; --line:#2b3446; --text:#e4e8f0; --muted:#9aa4b8;
    --accent:#d6a64a; --accent-soft:#3a2f18; --nav-text:#aeb9cd;
    --crit:#ef7d70; --crit-soft:#3d2120; --warn:#e3a94f; --warn-soft:#3a2d17; --ok:#6cc39a; --ok-soft:#183126; --info:#86acec; --info-soft:#1b2a44;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0d1526; --paper:#121722; --surface:#1a2130; --line:#2b3446; --text:#e4e8f0; --muted:#9aa4b8;
  --accent:#d6a64a; --accent-soft:#3a2f18; --nav-text:#aeb9cd;
  --crit:#ef7d70; --crit-soft:#3d2120; --warn:#e3a94f; --warn-soft:#3a2d17; --ok:#6cc39a; --ok-soft:#183126; --info:#86acec; --info-soft:#1b2a44;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--ink);color:var(--nav-text);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .univ{font-family:var(--font-display);color:#fff;font-size:18px;letter-spacing:-.01em}
.brand .sys{font-size:12.5px;margin-top:2px;opacity:.85}
.nav{list-style:none;margin:0;padding:10px 8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .no{font-family:var(--font-mono);font-size:11.5px;opacity:.7}
.nav .cnt{font-family:var(--font-mono);font-size:11.5px;padding:0 7px;border-radius:99px;background:rgba(255,255,255,.1)}
.nav .cnt.hot{background:var(--crit);color:#fff}
.side-foot{padding:12px 16px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#8892a6}
.dot.on{background:#5fd39b}.dot.off{background:#e0786c}

.main{min-width:0;overflow:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .crumb b{color:var(--text)}
.content{padding:24px 28px 96px;display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h1{font-size:26px}
.page-head p{margin:0;color:var(--muted);max-width:68ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card h2{font-size:17px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-size:28px;font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.crit{border-top-color:var(--crit)}.tile.warn{border-top-color:var(--warn)}.tile.info{border-top-color:var(--info)}.tile.ok{border-top-color:var(--ok)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1405}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1405}}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.55}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--font-display);font-size:17px;display:block;margin-bottom:4px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right}

.issue{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.issue.crit{border-left-color:var(--crit)}.issue.warn{border-left-color:var(--warn)}.issue.info{border-left-color:var(--info)}
.issue h3{font-family:var(--font-body);font-size:15.5px;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clause{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.clause .src{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.rec{font-size:13.5px;background:var(--ok-soft);border-radius:8px;padding:8px 12px}
.rec b{color:var(--ok)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--surface);font-size:13.5px}
.step b{display:block;font-size:14.5px;margin-bottom:2px}
.step .n{font-family:var(--font-mono);color:var(--accent);font-size:12px}
.notice{border-radius:8px;padding:10px 14px;font-size:13.5px;background:var(--info-soft);color:var(--text)}
.notice.warn{background:var(--warn-soft)}
.notice.crit{background:var(--crit-soft)}
.bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.prog{display:flex;flex-direction:column;gap:6px}
.mini{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{margin-top:5px}
.drafttbl td{font-size:13.5px;white-space:pre-wrap}
.drafttbl td.old{background:var(--crit-soft)}
.drafttbl td.new{background:var(--ok-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal pre{white-space:pre-wrap;font-family:var(--font-body);font-size:13.5px;background:var(--paper);padding:12px;border-radius:8px;margin:0;max-height:55vh;overflow:auto}
.tabbar{display:none}
.report h2{margin-top:6px}
.report p{max-width:72ch}
@media (max-width: 1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr 1fr}}
@media (max-width: 760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  .topbar{padding:10px 16px;background:var(--ink);color:#fff;border-bottom:0}
  .topbar .crumb{color:var(--nav-text)} .topbar .crumb b{color:#fff}
  .content{padding:16px 16px 110px}
  .page-head h1{font-size:22px}
  .g2,.cmp,.form{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
  .tabbar button{all:unset;flex:0 0 auto;color:var(--nav-text);font-size:12px;padding:8px 10px;border-radius:8px;text-align:center;min-width:64px}
  .tabbar button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  .mobile-brand{display:block!important}
}
.mobile-brand{display:none;font-family:var(--font-display);font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="주 메뉴">
    <div class="brand">
      <div class="univ">계명문화대학교</div>
      <div class="sys">AI 규정집 검토·개정 지원 시스템</div>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      <div><span class="dot" id="dotAI"></span><span id="stAI">AI 연결 확인 중</span></div>
      <div><span class="dot" id="dotDB"></span><span id="stDB">저장소 연결 확인 중</span></div>
      <div style="opacity:.7">소관: 기획실 규정 담당</div>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <div>
        <div class="mobile-brand">계명문화대 규정집 AI 검토</div>
        <div class="crumb">규정 검토 콘솔 · <b id="crumb">메인 대시보드</b></div>
      </div>
      <div class="row" id="topActions"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- 상태 ---------- */
const VIEWS=[
 {id:"dashboard",label:"메인 대시보드",short:"대시보드"},
 {id:"upload",label:"규정 등록",short:"등록"},
 {id:"list",label:"규정 관리 대장",short:"대장"},
 {id:"run",label:"AI 분석 실행",short:"분석"},
 {id:"conflicts",label:"상충·위계 위반",short:"상충"},
 {id:"terms",label:"용어 혼재",short:"용어"},
 {id:"orgs",label:"조직·부서명 불일치",short:"조직명"},
 {id:"drafts",label:"개정안 심의",short:"개정안"},
 {id:"report",label:"보고서",short:"보고서"}
];
const S={law:{enabled:true,laws:"고등교육법\n고등교육법 시행령\n사립학교법\n사립학교법 시행령\n교육기본법\n대학등록금에 관한 규칙"},mcp:null,lawStatus:"확인 전",view:"dashboard",regs:[],analysis:null,drafts:[],runs:[],orgBase:"",checklist:{},db:null,sample:null,downloads:null,readonly:false,running:false,busyDraft:null,dbReady:false};
const CATS=["학칙","규정","세칙","지침","내규"];
const CHUNK=60000;
const CHECKS=["상위 법령(고등교육법·시행령) 개정 사항 반영 여부","학칙 개정에 따른 하위 규정 일괄 정비 여부","부칙의 시행일·경과조치 기재 여부","개편 직제와 위원회 구성 조항 일치 여부","서식(별지) 명칭과 본문 인용 일치 여부"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=t=>{if(!t)return"-";const d=new Date(t);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.setAttribute("role","status");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
function sevClass(s){return s==="높음"?"crit":s==="중간"?"warn":"info"}

/* ---------- 내비게이션 ---------- */
function counts(){const a=S.analysis||{};return{regs:S.regs.length,conflicts:(a.conflicts||[]).length,terms:(a.terms||[]).length,orgs:(a.orgs||[]).length,drafts:S.drafts.filter(d=>d.status==="검토중").length}}
function renderNav(){
  const c=counts();
  const badge={list:c.regs,conflicts:c.conflicts,terms:c.terms,orgs:c.orgs,drafts:c.drafts};
  $("#nav").innerHTML=VIEWS.map((v,i)=>`<li><button data-v="${v.id}" ${S.view===v.id?'aria-current="page"':''}><span class="no">${String(i+1).padStart(2,"0")}</span><span>${v.label}</span>${badge[v.id]?`<span class="cnt ${v.id==="conflicts"?"hot":""}">${badge[v.id]}</span>`:""}</button></li>`).join("");
  $("#tabbar").innerHTML=VIEWS.map(v=>`<button data-v="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${v.short}${badge[v.id]?` ${badge[v.id]}`:""}</button>`).join("");
  $("#crumb").textContent=VIEWS.find(v=>v.id===S.view).label;const cur=$("#tabbar [aria-current]");if(cur&&getComputedStyle($("#tabbar")).display!=="none"){cur.scrollIntoView({block:"nearest",inline:"center"})}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b){go(b.dataset.v)}});
function go(v){if(!VIEWS.some(x=>x.id===v))v="dashboard";S.view=v;if(location.hash!=="#"+v){history.replaceState(null,"","#"+v)}render();$("#main").scrollTop=0}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.view)go(h)});

/* ---------- 렌더 ---------- */
function soft(){const ae=document.activeElement;if(S.view==="upload"||S.view==="run"||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$("#view").contains(ae))){renderNav();return}render()}
function render(){renderNav();const f=R[S.view];$("#view").innerHTML=f();bindView()}
const R={};
function head(t,p){return `<div class="page-head"><h1>${t}</h1>${p?`<p>${p}</p>`:""}</div>`}
function roNote(){return S.readonly?`<div class="notice warn">보기 전용 권한입니다. 규정 등록·분석·심의 결과 저장은 편집 권한이 있는 담당자만 할 수 있습니다.</div>`:""}
function noDbNote(){return (!S.db&&S.dbReady)?`<div class="notice warn">공유 저장소에 연결되지 않아, 이 화면을 닫으면 입력한 내용이 사라집니다. Claude에 로그인한 상태에서 여시면 기획실 담당자끼리 자료가 공유·보존됩니다.</div>`:""}

R.dashboard=()=>{
  const c=counts(),a=S.analysis;
  const hi=a?(a.conflicts||[]).filter(x=>x.severity==="높음").length:0;
  const tiles=`<div class="grid g4">
   <div class="tile info"><span class="lbl">등록 규정</span><span class="val">${c.regs}</span><span class="sub">학칙·규정·세칙·지침</span></div>
   <div class="tile crit"><span class="lbl">상충·위계 위반</span><span class="val">${c.conflicts}</span><span class="sub">그중 중대 ${hi}건</span></div>
   <div class="tile warn"><span class="lbl">용어 혼재</span><span class="val">${c.terms}</span><span class="sub">표준용어 정비 대상</span></div>
   <div class="tile ok"><span class="lbl">조직·부서명 불일치</span><span class="val">${c.orgs}</span><span class="sub">개정안 심의 대기 ${c.drafts}건</span></div></div>`;
  const steps=`<div class="steps">
   <div class="step"><span class="n">STEP 1</span><b>규정 등록</b>PDF·텍스트 파일을 올리거나 조문을 붙여 넣습니다.</div>
   <div class="step"><span class="n">STEP 2</span><b>AI 분석 실행</b>상충, 위계 위반, 용어 혼재, 조직명 불일치를 한 번에 점검합니다.</div>
   <div class="step"><span class="n">STEP 3</span><b>결과 검토</b>지적 사항별 관련 조문을 나란히 비교합니다.</div>
   <div class="step"><span class="n">STEP 4</span><b>개정안 심의</b>신구조문대비표를 생성하고 승인·반려를 기록합니다.</div></div>`;
  let body;
  if(!a){
    body=`<div class="card empty"><h3>${c.regs?"등록된 규정을 분석할 차례입니다":"아직 등록된 규정이 없습니다"}</h3><p>${c.regs?`규정 ${c.regs}건이 등록되어 있습니다. AI 분석을 실행하면 상충 조항과 정비 대상이 이 화면에 요약됩니다.`:"규정 PDF를 등록하거나, 기능을 먼저 살펴보려면 예시 규정(가상 데이터)을 불러오십시오."}</p>
    <div class="row" style="justify-content:center;margin-top:12px">${c.regs?`<button class="btn primary" data-v="run">AI 분석 실행</button>`:`<button class="btn primary" data-v="upload">규정 등록하기</button><button class="btn" id="btnDemo">예시 규정 불러오기</button>`}</div></div>`;
  }else{
    const top=(a.conflicts||[]).slice().sort((x,y)=>"높음중간낮음".indexOf(x.severity)-"높음중간낮음".indexOf(y.severity)).slice(0,4);
    body=`<div class="grid g2">
     <div class="card"><h2>AI 종합 의견</h2><p style="margin:0">${esc(a.summary||"")}</p>${a.lawChecked?`<p style="margin:10px 0 0"><span class="pill info">상위 법령</span> ${esc(a.lawSummary)}</p><p class="mini" style="margin:4px 0 0">국가법령정보 조회 ${(a.lawLog||[]).length}회</p>`:a.lawErr?`<div class="notice warn" style="margin-top:10px">상위 법령 대조 미실시: ${esc(a.lawErr)}</div>`:""}<p class="mini" style="margin:10px 0 0">분석 시각 ${fmtDate(a.at)} · 대상 규정 ${a.regCount||"-"}건${a.truncated?" · 일부 장문은 앞부분만 분석":""}</p></div>
     <div class="card"><h2>우선 검토 대상</h2>${top.length?top.map(x=>`<div class="chk"><span class="pill ${sevClass(x.severity)}">${esc(x.severity)}</span><div><b>${esc(x.title||x.type)}</b><div class="mini">${esc(x.regA)} ${esc(x.articleA||"")} ↔ ${esc(x.regB)} ${esc(x.articleB||"")}</div></div></div>`).join(""):`<p class="mini">상충 조항이 발견되지 않았습니다.</p>`}
     <div class="row" style="margin-top:10px"><button class="btn sm" data-v="conflicts">전체 보기</button></div></div></div>
     <div class="card"><h2>분석 이력</h2>${S.runs.length?`<div class="tbl-wrap"><table><thead><tr><th>실행 시각</th><th>내용</th><th class="num">규정</th><th class="num">상충</th><th class="num">용어</th><th class="num">조직명</th></tr></thead><tbody>${S.runs.slice(0,8).map(r=>`<tr><td class="num" style="text-align:left">${fmtDate(r.at)}</td><td>${esc(r.label)}</td><td class="num">${r.regCount}</td><td class="num">${r.conflicts}</td><td class="num">${r.terms}</td><td class="num">${r.orgs}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mini">아직 기록이 없습니다.</p>`}</div>`;
  }
  return head("규정집 분석 총괄판","학칙과 하위 규정 사이의 상충, 상위 규정 위반, 행정 용어 혼선, 개편 전 조직명 잔존 여부를 한눈에 봅니다.")+roNote()+noDbNote()+tiles+body+(a?"":steps);
};

R.upload=()=>head("규정 등록","PDF·텍스트 파일을 올리거나 조문을 직접 붙여 넣습니다. 파일 내용은 이 화면 안에서 글자로 바뀌어 저장되며, 원본 파일은 업로드되지 않습니다.")+roNote()+noDbNote()+`
 <div class="card"><div class="drop" id="drop" tabindex="0" role="button" aria-label="파일 선택"><b>PDF 또는 TXT 파일을 끌어 놓거나 눌러서 선택</b><span class="mini">여러 파일을 한꺼번에 올릴 수 있습니다. 파일명이 규정명으로 자동 입력됩니다. 한글(HWP) 파일은 PDF로 저장한 뒤 올리거나 본문을 아래에 붙여 넣으십시오.</span></div>

  <div class="form">

 </div>`;

R.list=()=>head("규정 관리 대장",`등록 규정 ${S.regs.length}건. 분석 대상 여부는 AI 분석 실행 화면에서 고릅니다.`)+roNote()+(S.regs.length?`
 <div class="card tbl-wrap"><table><thead><tr><th>규정명</th><th>구분</th><th>소관 부서</th><th>최종 개정일</th><th class="num">분량</th><th>등록</th><th></th></tr></thead><tbody>
 ${S.regs.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.demo?' <span class="pill mute">예시</span>':""}</td><td>${esc(r.category)}</td><td>${esc(r.dept||"-")}</td><td class="num" style="text-align:left">${esc(r.date||"-")}</td><td class="num">${(r.chars||0).toLocaleString()}자</td><td class="mini">${fmtDate(r.createdAt)}</td>
 <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-view-reg="${r.id}">본문</button><button class="btn sm danger" data-del-reg="${r.id}" ${S.readonly?"disabled":""}>삭제</button></div></td></tr>`).join("")}
 </tbody></table></div>`:`<div class="card empty"><h3>등록된 규정이 없습니다</h3><div class="row" style="justify-content:center"><button class="btn primary" data-v="upload">규정 등록하기</button><button class="btn" id="btnDemo">예시 규정 불러오기</button></div></div>`);

R.run=()=>{
  const ai=!!S.sample;
  return head("AI 분석 실행","선택한 규정 전체를 AI가 교차 검토합니다. 기준 조직표를 넣으면 개편 전 부서명을 더 정확히 찾습니다.")+roNote()+
  (ai?"":`<div class="notice warn">이 화면에서는 AI 기능을 쓸 수 없습니다. Claude에 로그인한 상태에서 열고, 처음 실행할 때 나오는 사용 허용 창에서 허용을 누르십시오.</div>`)+`
  <div class="grid g2">
   <div class="card"><h2>분석 대상 규정</h2>${S.regs.length?`<div class="row" style="margin-bottom:6px"><button class="btn sm" id="selAll">전체 선택</button><button class="btn sm" id="selNone">선택 해제</button></div>`+S.regs.map(r=>`<label class="chk"><input type="checkbox" class="regsel" value="${r.id}" checked><span><b>${esc(r.name)}</b> <span class="mini">${esc(r.category)} · ${(r.chars||0).toLocaleString()}자</span></span></label>`).join(""):`<p class="mini">먼저 규정을 등록하십시오.</p>`}</div>
   <div class="card"><h2>기준 조직표 (현행 부서명)</h2><p class="mini" style="margin-top:0">현행 직제의 부서명을 한 줄에 하나씩 적습니다. 비워 두면 규정끼리 비교해 표기가 다른 부서명만 찾습니다.</p>
    <label class="f" for="orgBase">현행 부서명 목록<textarea id="orgBase" placeholder="기획실&#10;교무처&#10;학생처">${esc(S.orgBase)}</textarea></label>
    <div class="row" style="margin-top:8px"><span class="spacer"></span><button class="btn sm" id="saveOrg" ${S.readonly?"disabled":""}>조직표 저장</button></div></div>
  </div>
  <div class="card"><div class="row"><h2 style="margin:0">상위 법령 대조</h2><span class="pill ${S.lawStatus==="연결됨"?"ok":S.lawStatus==="확인 전"?"mute":"warn"}">Korean Law · ${esc(S.lawStatus)}</span><span class="spacer"></span><label class="row" for="lawOn" style="gap:6px;font-size:14px"><input type="checkbox" id="lawOn" ${S.law.enabled?"checked":""} ${S.mcp?"":"disabled"}>분석에 포함</label></div>
   <p class="mini" style="margin:6px 0 10px">국가법령정보(법제처) 커넥터로 현행 법령 조문을 실시간으로 찾아, 학칙·규정이 상위 법령과 어긋나는 부분을 근거 조문과 함께 제시합니다.</p>
   ${S.mcp?"":`<div class="notice warn">이 화면에서는 커넥터를 쓸 수 없습니다. Claude에 로그인한 상태에서 열고, claude.ai 설정 → 커넥터에서 ‘Korean Law’가 연결되어 있는지 확인하십시오.</div>`}
   ${S.lawStatus==="재연결 필요"?`<div class="notice warn">Korean Law 커넥터의 인증이 만료되었습니다. claude.ai 설정 → 커넥터에서 Korean Law를 다시 연결한 뒤 이 화면을 새로 여십시오.</div>`:""}
   ${S.lawStatus==="미연결"?`<div class="notice warn">Korean Law 커넥터가 연결되어 있지 않습니다. claude.ai 설정 → 커넥터에서 추가하십시오.</div>`:""}${S.lawStatus==="서버 미설정"?`<div class="notice warn">서버에 법제처 Open API 인증키(LAW_OC)가 설정되지 않았습니다. 관리자에게 Vercel 환경변수 설정을 요청하십시오.</div>`:""}
   <label class="f" for="lawList">우선 대조할 상위 법령 (한 줄에 하나, AI가 필요하면 다른 법령도 찾아봅니다)<textarea id="lawList" style="min-height:110px">${esc(S.law.laws)}</textarea></label>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="lawTest" ${S.mcp?"":"disabled"}>커넥터 연결 확인</button><span class="mini" id="lawTestOut"></span><span class="spacer"></span><button class="btn sm" id="saveLaw" ${S.readonly?"disabled":""}>설정 저장</button></div>
  </div>
  <div class="card"><h2>점검 항목</h2>
   <div class="grid g4">
    <div><span class="pill crit">상충</span><p class="mini">같은 사안을 다르게 정한 조문</p></div>
    <div><span class="pill crit">위계·상위법</span><p class="mini">학칙과 어긋나는 하위 규정, 고등교육법 등 상위 법령과 상충</p></div>
    <div><span class="pill warn">용어 혼재</span><p class="mini">같은 대상을 다른 말로 쓴 경우</p></div>
    <div><span class="pill ok">조직명</span><p class="mini">개편 전 부서명·직위명 잔존</p></div>
   </div>
   <div class="row" style="margin-top:14px"><span class="mini" id="runInfo"></span><span class="spacer"></span><button class="btn gold" id="btnRun" ${(!ai||!S.regs.length||S.running||S.readonly)?"disabled":""}>${S.running?'<span class="spin"></span> 분석 중':"AI 분석 실행"}</button></div>
   <div id="runProg" class="prog" style="margin-top:10px"></div>
  </div>`;
};

function issueActions(kind,i){return `<div class="row"><span class="spacer"></span><button class="btn sm primary" data-draft="${kind}:${i}" ${(!S.sample||S.readonly||S.busyDraft)?"disabled":""}>${S.busyDraft===kind+":"+i?'<span class="spin"></span> 생성 중':"개정안 생성"}</button></div>`}
function noAnalysis(){return `<div class="card empty"><h3>분석 결과가 없습니다</h3><p>규정을 등록하고 AI 분석을 실행하십시오.</p><div class="row" style="justify-content:center"><button class="btn primary" data-v="run">AI 분석 실행으로</button></div></div>`}

R.conflicts=()=>{const a=S.analysis;const L=a?(a.conflicts||[]):[];
  const lawN=L.filter(x=>x.law).length;
  return head("상충·위계 위반",`규정 간 충돌과 상위 규정·법령 위반 ${L.length}건${lawN?` (상위 법령 상충 ${lawN}건 포함)`:""}. 관련 조문을 나란히 비교합니다.`)+(a&&a.lawLog&&a.lawLog.length?`<details class="card"><summary style="cursor:pointer;font-weight:600">국가법령정보 조회 내역 ${a.lawLog.length}건</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>도구</th><th>조회 내용</th><th>결과</th></tr></thead><tbody>${a.lawLog.map(l=>`<tr><td class="num" style="text-align:left">${esc(l.tool)}</td><td class="mini">${esc(l.q)}</td><td>${l.ok?'<span class="pill ok">성공</span>':'<span class="pill crit">실패</span>'}</td></tr>`).join("")}</tbody></table></div></details>`:"")+(!a?noAnalysis():L.length?L.map((x,i)=>`<article class="issue ${sevClass(x.severity)}">
   <div class="row"><span class="pill ${sevClass(x.severity)}">${esc(x.severity)}</span><span class="pill mute">${esc(x.type)}</span><h3>${esc(x.title||"")}</h3></div>
   <div class="cmp"><div class="clause"><div class="src">${esc(x.regA)} ${esc(x.articleA||"")}</div>${esc(x.textA||"")}</div><div class="clause" ${x.law?'style="border-color:var(--info)"':""}><div class="src">${x.law?'<span class="pill info">상위 법령</span> ':""}${esc(x.regB)} ${esc(x.articleB||"")}${x.lawDate?` · 시행 ${esc(x.lawDate)}`:""}</div>${esc(x.textB||"")}${x.law?`<div style="margin-top:6px"><a href="https://www.law.go.kr/법령/${encodeURIComponent(String(x.regB||"").trim())}" target="_blank" rel="noopener">국가법령정보센터에서 원문 보기</a></div>`:""}</div></div>
   <div>${esc(x.issue||"")}</div>${x.recommendation?`<div class="rec"><b>정비 권고</b> ${esc(x.recommendation)}</div>`:""}${issueActions("c",i)}</article>`).join(""):`<div class="card empty"><h3>상충 조항이 발견되지 않았습니다</h3></div>`);};

R.terms=()=>{const a=S.analysis;const L=a?(a.terms||[]):[];
  return head("용어 혼재",`같은 대상을 다르게 부르는 표현 ${L.length}건. 표준 용어로 통일할 것을 권고합니다.`)+(!a?noAnalysis():L.length?`<div class="card tbl-wrap"><table><thead><tr><th>표준 용어(권고)</th><th>혼용 표현</th><th>사용 규정</th><th>판단 근거</th><th></th></tr></thead><tbody>${L.map((t,i)=>`<tr><td><b>${esc(t.standard)}</b></td><td>${(t.variants||[]).map(v=>`<span class="pill warn" style="margin:0 4px 4px 0">${esc(v)}</span>`).join("")}</td><td class="mini">${esc((t.regs||[]).join(", "))}</td><td>${esc(t.note||"")}</td><td><button class="btn sm" data-draft="t:${i}" ${(!S.sample||S.readonly||S.busyDraft)?"disabled":""}>${S.busyDraft==="t:"+i?'<span class="spin"></span>':"개정안"}</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty"><h3>용어 혼재가 발견되지 않았습니다</h3></div>`);};

R.orgs=()=>{const a=S.analysis;const L=a?(a.orgs||[]):[];
  return head("조직·부서명 불일치",`개편 전 명칭이나 표기가 다른 부서·직위명 ${L.length}건.${S.orgBase?" 기준 조직표와 대조했습니다.":" 기준 조직표 없이 규정끼리 비교했습니다."}`)+(!a?noAnalysis():L.length?`<div class="card tbl-wrap"><table><thead><tr><th>규정에 쓰인 명칭</th><th>정비 명칭(권고)</th><th>위치</th><th>근거</th><th></th></tr></thead><tbody>${L.map((o,i)=>`<tr><td><span class="pill crit">${esc(o.found)}</span></td><td><span class="pill ok">${esc(o.suggested||"확인 필요")}</span></td><td class="mini">${esc((o.locations||[]).join(", "))}</td><td>${esc(o.basis||"")}</td><td><button class="btn sm" data-draft="o:${i}" ${(!S.sample||S.readonly||S.busyDraft)?"disabled":""}>${S.busyDraft==="o:"+i?'<span class="spin"></span>':"개정안"}</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty"><h3>조직명 불일치가 발견되지 않았습니다</h3></div>`);};

R.drafts=()=>{const L=S.drafts;
  return head("개정안 심의","AI가 만든 신구조문대비표를 검토하고 승인·반려를 기록합니다. 최종 개정은 학내 규정 제·개정 절차를 따릅니다.")+roNote()+(L.length?L.map(d=>`<article class="issue ${d.status==="승인"?"info":d.status==="반려"?"crit":"warn"}">
   <div class="row"><span class="pill ${d.status==="승인"?"ok":d.status==="반려"?"crit":"warn"}">${esc(d.status)}</span><h3>${esc(d.title)}</h3><span class="spacer"></span><span class="mini">${fmtDate(d.createdAt)}</span></div>
   <div class="tbl-wrap"><table class="drafttbl"><thead><tr><th>규정·조문</th><th>현행</th><th>개정안</th><th>개정 사유</th></tr></thead><tbody>${(d.rows||[]).map(r=>`<tr><td><b>${esc(r.reg||"")}</b><br><span class="mini">${esc(r.article||"")}</span></td><td class="old">${esc(r.current)}</td><td class="new">${esc(r.revised)}</td><td>${esc(r.reason||"")}</td></tr>`).join("")}</tbody></table></div>
   ${d.note?`<div class="mini">${esc(d.note)}</div>`:""}
   <div class="row"><label class="f" for="cm-${d.id}" style="flex:1;min-width:220px">심의 의견<input type="text" id="cm-${d.id}" value="${esc(d.comment||"")}" placeholder="의견을 적고 승인 또는 반려를 누르십시오"></label>
   <div class="row" style="align-self:flex-end"><button class="btn sm" data-dec="승인:${d.id}" ${S.readonly?"disabled":""}>승인</button><button class="btn sm danger" data-dec="반려:${d.id}" ${S.readonly?"disabled":""}>반려</button><button class="btn sm" data-dec="검토중:${d.id}" ${S.readonly?"disabled":""}>보류</button><button class="btn sm" data-copy-draft="${d.id}">표 복사</button></div></div></article>`).join(""):`<div class="card empty"><h3>생성된 개정안이 없습니다</h3><p>상충·용어·조직명 결과 화면에서 ‘개정안 생성’을 누르면 이곳에 쌓입니다.</p></div>`);};

function reportText(){
  const a=S.analysis;const c=counts();const lines=[];
  lines.push("계명문화대학교 규정집 AI 검토 결과 보고",`작성: ${fmtDate(Date.now())} / 분석 시각: ${a?fmtDate(a.at):"-"}`,"",
   "1. 개요",`- 대상 규정 ${a?a.regCount:c.regs}건`,`- 상충·위계 위반 ${c.conflicts}건, 용어 혼재 ${c.terms}건, 조직·부서명 불일치 ${c.orgs}건`,`- 개정안 ${S.drafts.length}건 (승인 ${S.drafts.filter(d=>d.status==="승인").length}, 반려 ${S.drafts.filter(d=>d.status==="반려").length}, 검토중 ${c.drafts})`,"");
  if(a){lines.push("2. 종합 의견",`- ${a.summary||""}`,"","3. 상충·위계 위반");
    (a.conflicts||[]).forEach((x,i)=>lines.push(`  ${i+1}) [${x.severity}/${x.type}] ${x.title||""}`,`     - ${x.regA} ${x.articleA||""} ↔ ${x.regB} ${x.articleB||""}`,`     - 문제: ${x.issue||""}`,`     - 권고: ${x.recommendation||""}`));
    if(a.lawChecked)lines.splice(lines.indexOf("3. 상충·위계 위반"),0,"2-1. 상위 법령 대조 (국가법령정보 실시간 조회)",`- ${a.lawSummary||""}`,`- 조회 ${(a.lawLog||[]).length}회`,"");
    lines.push("","4. 용어 혼재");(a.terms||[]).forEach((t,i)=>lines.push(`  ${i+1}) 표준 '${t.standard}' ← ${(t.variants||[]).join(", ")} (${(t.regs||[]).join(", ")})`));
    lines.push("","5. 조직·부서명 불일치");(a.orgs||[]).forEach((o,i)=>lines.push(`  ${i+1}) '${o.found}' → '${o.suggested||"확인 필요"}' (${(o.locations||[]).join(", ")})`));}
  lines.push("","6. 개정안 심의 현황");S.drafts.forEach((d,i)=>lines.push(`  ${i+1}) [${d.status}] ${d.title}${d.comment?` — 의견: ${d.comment}`:""}`));
  lines.push("","※ 본 결과는 AI 보조 검토 자료이며, 최종 판단은 규정 담당 부서의 검토를 거쳐야 합니다.");

async function handleFiles(list){
  if(S.readonly){toast("편집 권한이 없어 등록할 수 없습니다.");return}
  const files=[...list];const prog=$("#fileProg");

    const bar=row.querySelector("i"),st=row.querySelector(".st");
    try{
      let text="";
      if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){text=await pdfText(f,p=>{bar.style.width=Math.round(p*90)+"%"})}
      else{text=await f.text()}
      text=text.replace(/[ \t]+\n/g,"\n").replace(/\n{2,}/g,"\n").replace(/제\s+(\d+)\s*(조|항|호|장|절|관)/g,"제$1$2").replace(/(\d)\s+(년|월|일|개월|학기|학년|학점|시간|명|인|회|차|%)/g,"$1$2").replace(/([가-힣])\s+(\d+)\s+([가-힣])/g,"$1 $2$3").trim();
      if(text.length<30){st.textContent="글자를 찾지 못함";bar.style.width="100%";bar.style.background="var(--crit)";

      const name=f.name.replace(/\.(pdf|txt)$/i,"");
      const cat=/학칙/.test(name)?"학칙":/세칙/.test(name)?"세칙":/지침/.test(name)?"지침":/내규/.test(name)?"내규":"규정";
      await addReg({name,category:cat,dept:"",date:"",text});
      bar.style.width="100%";st.textContent=`등록 완료 · ${text.length.toLocaleString()}자`;
    }catch(e){console.error(e);st.textContent="읽기 실패";bar.style.background="var(--crit)";bar.style.width="100%"}
  }
  renderNav();
}
async function pdfText(file,onP){
  const lib=window.pdfjsLib;if(!lib)throw new Error("PDF 모듈 없음");
  lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf,isEvalSupported:false}).promise;
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    let last=null,line="";const lines=[];
    for(const it of tc.items){const y=it.transform?Math.round(it.transform[5]):0;if(last!==null&&Math.abs(y-last)>2){lines.push(line);line=""}line+=it.str;if(it.hasEOL){lines.push(line);line=""}last=y}
    if(line)lines.push(line);out.push(lines.join("\n"));onP&&onP(i/pdf.numPages);
  }
  return out.join("\n");
}

async function lawTools(force){

}

function xesc(s){return String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function buildSectionXml(){
  let id=1000000100;const nid=()=>String(id++);let tid=1000009000;

  const TBL=(widths,head,rows)=>{
    const est=(t,w)=>{const lines=String(t||"").split("\n").reduce((n,l)=>n+Math.max(1,Math.ceil(l.length*1000/Math.max(2000,w-600))),0);return Math.max(1,lines)*1600+600};
    const cell=(t,c,r,w,h,isHead)=>`<hp:tc name="" header="${isHead?1:0}" hasMargin="0" protect="0" editable="0" dirty="1" borderFillIDRef="${isHead?4:3}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${String(t??"").split("\n").map(line=>`<hp:p paraPrIDRef="${isHead?21:22}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0" id="${nid()}"><hp:run charPrIDRef="${isHead?9:0}">${line?`<hp:t>${xesc(line)}</hp:t>`:"<hp:t/>"}</hp:run></hp:p>`).join("")}</hp:subList><hp:cellAddr colAddr="${c}" rowAddr="${r}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="283" right="283" top="141" bottom="141"/></hp:tc>`;
    const all=[head,...rows];let total=0;
    const trs=all.map((row,r)=>{const h=Math.max(...row.map((t,c)=>est(t,widths[c])));total+=h;return `<hp:tr>${row.map((t,c)=>cell(t,c,r,widths[c],h,r===0)).join("")}</hp:tr>`}).join("");
    return `<hp:p id="${nid()}" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0"><hp:tbl id="${tid++}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${all.length}" colCnt="${widths.length}" cellSpacing="0" borderFillIDRef="3" noAdjust="0"><hp:sz width="42520" widthRelTo="ABSOLUTE" height="${total}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="0" right="0" top="0" bottom="0"/>${trs}</hp:tbl></hp:run></hp:p>`;
  };
  const a=S.analysis,c=counts(),d=new Date();
  const out=[];
  out.push(BL(),P("계명문화대학교 규정집 AI 검토 결과 보고",20,12),BL(),P(`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. 기획실`,23,0),BL());
  out.push(H("1. 검토 개요"));
  out.push(B(`□ 대상 규정: ${a?a.regCount:c.regs}건${a&&a.regNames?` (${a.regNames.slice(0,8).join(", ")}${a.regNames.length>8?" 등":""})`:""}`));
  out.push(B(`□ 분석 시각: ${a?fmtDate(a.at):"미실시"}${a&&a.truncated?" (일부 장문은 앞부분만 분석)":""}`));
  out.push(B(`□ 검토 결과: 상충·위계 위반 ${c.conflicts}건, 용어 혼재 ${c.terms}건, 조직·부서명 불일치 ${c.orgs}건`));
  out.push(B(`□ 개정안: ${S.drafts.length}건 (승인 ${S.drafts.filter(x=>x.status==="승인").length}, 반려 ${S.drafts.filter(x=>x.status==="반려").length}, 검토중 ${c.drafts})`));
  if(a){
    out.push(BL(),H("2. AI 종합 의견"),B("□ "+(a.summary||"-")));
    if(a.lawChecked){out.push(BL(),H("3. 상위 법령 대조 (국가법령정보 실시간 조회)"),B("□ "+(a.lawSummary||"-")),SUB(`① 법령 조회 ${(a.lawLog||[]).length}회, 상위 법령 상충 ${(a.conflicts||[]).filter(x=>x.law).length}건`))}
    else if(a.lawErr){out.push(BL(),H("3. 상위 법령 대조"),B("□ 미실시: "+a.lawErr))}

    out.push(BL(),H("6. 조직·부서명 불일치"));
    const O=a.orgs||[];
    if(O.length)out.push(TBL([9000,9000,12260,12260],["규정상 명칭","정비 명칭(권고)","위치","근거"],O.map(o=>[o.found,o.suggested||"확인 필요",(o.locations||[]).join(", "),o.basis||""])));else out.push(B("□ 해당 없음"));
  }
  out.push(BL(),H("7. 개정안 심의 현황"));
  if(!S.drafts.length)out.push(B("□ 생성된 개정안 없음"));
  S.drafts.forEach((dr,i)=>{out.push(B(`□ ${dr.title} [${dr.status}]${dr.comment?` - 심의 의견: ${dr.comment}`:""}`));
    if((dr.rows||[]).length)out.push(TBL([8000,12000,12000,10520],["규정·조문","현  행","개 정 안","개정 사유"],dr.rows.map(r=>[`${r.reg||""}\n${r.article||""}`,r.current||"",r.revised||"",r.reason||""])));
    if(i<S.drafts.length-1)out.push(BL())});
  out.push(BL(),H("8. 추가 점검 체크리스트"));
  CHECKS.forEach((t,i)=>out.push(SUB(`${S.checklist["k"+i]?"■":"□"} ${t}`)));
  out.push(BL(),P("※ 본 결과는 AI 보조 검토 자료이며, 최종 판단은 규정 담당 부서의 검토와 학내 제·개정 절차를 거쳐야 함.",0,11));
  return HWPX_TPL.__secHead+"\n"+out.join("\n")+"\n</hs:sec>";
}
async function buildHwpxBlob(){
  if(!window.JSZip)throw new Error("zip");
  const z=new JSZip();const NF={createFolders:false};
  z.file("mimetype","application/hwp+zip",{compression:"STORE",createFolders:false});
  for(const k of ["version.xml","Contents/header.xml"])z.file(k,HWPX_TPL[k],NF);
  z.file("Contents/section0.xml",buildSectionXml(),NF);
  z.file("settings.xml",HWPX_TPL["settings.xml"],NF);
  const now=new Date().toISOString().slice(0,19)+"Z";
  z.file("Contents/content.hpf",HWPX_TPL["Contents/content.hpf"].replace("<opf:title/>","<opf:title>계명문화대학교 규정집 AI 검토 결과 보고</opf:title>").replace('name="creator" content="text"','name="creator" content="기획실"').replace('name="CreatedDate" content="text"',`name="CreatedDate" content="${now}"`).replace('name="ModifiedDate" content="text"',`name="ModifiedDate" content="${now}"`),NF);
  z.file("Preview/PrvText.txt",reportText().slice(0,1000),NF);
  for(const k of ["META-INF/container.xml","META-INF/container.rdf","META-INF/manifest.xml"])z.file(k,HWPX_TPL[k],NF);
  return z.generateAsync({type:"uint8array",compression:"DEFLATE",mimeType:"application/hwp+zip"});
}

  if(S.readonly){toast("편집 권한이 없어 불러올 수 없습니다.");return}

   {name:"(예시) 학칙",category:"학칙",dept:"교무처",date:"2025-03-01",text:"제1조(목적) 이 학칙은 대학의 교육 운영에 관한 사항을 정함을 목적으로 한다.\n제20조(수업연한) 수업연한은 2년 또는 3년으로 한다.\n제35조(휴학) ① 학생은 질병 등의 사유로 총장의 허가를 받아 휴학할 수 있다.\n② 휴학 기간은 통산 3년을 초과할 수 없다.\n제41조(성적평가) 성적은 A+부터 F까지로 평가하며 세부 사항은 학사운영규정으로 정한다.\n제60조(위원회) 교무위원회는 교무처장을 위원장으로 한다."},
   {name:"(예시) 학사운영규정",category:"규정",dept:"교무처",date:"2023-02-15",text:"제1조(목적) 이 규정은 학칙 제41조에 따라 학사 운영의 세부 사항을 정한다.\n제12조(휴학) ① 일반휴학 기간은 통산 4년을 초과할 수 없다.\n② 휴학 신청은 학과주임의 확인을 받아 교무과에 제출한다.\n제18조(성적평가) 성적은 A부터 F까지로 평가한다.\n제25조(학사경고) 학과장은 학사경고 대상자를 상담하여야 한다."},
   {name:"(예시) 장학금지급규정",category:"규정",dept:"학생처",date:"2022-09-01",text:"제1조(목적) 이 규정은 장학금 지급에 관한 사항을 정한다.\n제5조(장학위원회) 장학위원회는 학생복지처장을 위원장으로 한다.\n제8조(지급 제한) 휴학 중인 학생에게는 장학금을 지급하지 아니한다.\n제9조(추천) 학과주임은 성적우수 장학생을 추천한다."}];
  for(const d of demo)await addReg({...d,demo:true});
  toast("예시 규정 3건(가상 데이터)을 불러왔습니다.");go("list");
}

/* ---------- 초기화 ---------- */
function setStatus(){
  $("#dotAI").className="dot "+(S.sample?"on":"off");$("#stAI").textContent=S.sample?"AI 분석 엔진 사용 가능":"AI 사용 불가(로그인 필요)";
  $("#dotDB").className="dot "+(S.db?"on":"off");$("#stDB").textContent=S.db?(S.db.__local?"이 PC 브라우저에 저장":"공유 저장소 연결됨"):"임시 저장(새로고침 시 삭제)";
}
async function init(){
  const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h))S.view=h;
  render();setStatus();
  if(!window.claude||!window.claude.use){S.dbReady=true;render();setStatus();return}
  const use=n=>window.claude.use(n).catch(()=>null);
  const [db,sample,downloads,user,mcp]=await Promise.all([use("db"),use("sample"),use("downloads"),use("user"),use("mcp")]);S.mcp=mcp;
  if(mcp){mcp.listTools(LAW_SERVER).then(r=>{const sv=(r.servers||[]).find(x=>x.server===LAW_SERVER);S.lawStatus=!sv||!sv.tools||!sv.tools.length?"미연결":sv.authStatus==="needs_reauth"?"재연결 필요":"사용 가능";soft()}).catch(e=>{lawErrMsg(e);soft()})}else{S.lawStatus="사용 불가"}
  S.sample=sample;S.downloads=downloads;
  if(user&&user.can){try{const w=await user.can("data.write");if(w===false)S.readonly=true}catch(e){}}
  if(db){
    S.db=db;
    const timer=setTimeout(()=>{if(!S.dbReady){S.dbReady=true;toast("저장소 응답이 늦습니다. 표시된 내용이 최신이 아닐 수 있습니다.");render()}},10000);
    const done=()=>{if(!S.dbReady){S.dbReady=true;clearTimeout(timer)}};
    const fail=e=>{done();console.warn(e);setStatus();render()};
    db.collection("regs").orderBy("createdAt","desc").onSnapshot(s=>{S.regs=s.docs.map(d=>d.data());if(!s.metadata.fromCache)done();soft()},fail);
    db.collection("drafts").orderBy("createdAt","desc").onSnapshot(s=>{S.drafts=s.docs.map(d=>d.data());soft()},fail);
    db.collection("runs").orderBy("at","desc").limit(20).onSnapshot(s=>{S.runs=s.docs.map(d=>d.data());soft()},fail);
    db.doc("app/analysis").onSnapshot(s=>{S.analysis=s.exists?s.data():null;soft()},fail);
    db.doc("app/orgbase").onSnapshot(s=>{S.orgBase=s.exists?(s.data().text||""):"";const ta=$("#orgBase");if(ta&&document.activeElement!==ta)ta.value=S.orgBase;soft()},fail);
    db.doc("app/lawcfg").onSnapshot(s=>{if(s.exists){const d=s.data();S.law={enabled:d.enabled!==false,laws:String(d.laws||S.law.laws)};const ta=$("#lawList");if(ta&&document.activeElement!==ta)ta.value=S.law.laws}soft()},fail);
    db.doc("app/checklist").onSnapshot(s=>{S.checklist=s.exists?{...s.data()}:{};soft()},fail);
  }else{S.dbReady=true}
  setStatus();render();
}
init();
</script>
</body>
</html>
